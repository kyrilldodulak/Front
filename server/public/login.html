<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — GameShop</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти до основного вмісту</a>

  <header id="siteHeader">
    <div class="header-inner">
      <a href="/" class="logo">GAME<span>SHOP</span></a>
      <nav aria-label="Основна навігація"></nav>
      <div class="header-actions" id="authBlock"></div>
    </div>
  </header>

  <main id="main">
    <section class="auth-box" aria-labelledby="loginTitle">
      <header class="auth-head">
        <h1 id="loginTitle">Вхід</h1>
        <p class="muted">Введи логін і пароль, щоб продовжити.</p>
      </header>

      <div class="auth-demo">
        <button type="button" class="auth-demo-chip" data-fill data-username="admin" data-password="admin">admin</button>
        <button type="button" class="auth-demo-chip" data-fill data-username="user" data-password="user">user</button>
      </div>

      <form id="loginForm" class="stack" novalidate>
        <div class="form-row">
          <label for="loginUsername">Логін або email</label>
          <input id="loginUsername" name="username" type="text" required autocomplete="username">
          <span class="error-text" data-error-for="username"></span>
        </div>
        <div class="form-row">
          <label for="loginPassword">Пароль</label>
          <div class="auth-password">
            <input id="loginPassword" name="password" type="password" required autocomplete="current-password">
            <button type="button" class="auth-eye" data-toggle-password aria-label="Показати пароль">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="error-text" data-error-for="password"></span>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Увійти</button>
        <p class="error-text center" id="loginError"></p>
      </form>

      <p class="auth-switch">Немає акаунту? <a href="/register.html">Зареєструватись</a></p>
    </section>
  </main>

  <footer class="site">
    <div class="footer-inner">
      <div><h4>GameShop</h4><p>© 2026, КПІ ім. Сікорського</p></div>
    </div>
  </footer>

  <script src="/js/header.js" defer></script>
  <script src="/js/cart.js" defer></script>
  <script src="/js/auth-ui.js" defer></script>
  <script src="/js/validation.js" defer></script>
</body>
</html>
