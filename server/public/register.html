<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстрація — GameShop</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти до основного вмісту</a>

  <header id="siteHeader">
    <div class="header-inner">
      <a href="/" class="logo">GAME<span>SHOP</span></a>
      <nav aria-label="Основна навігація"></nav>
      <div class="header-actions" id="authBlock"></div>
    </div>
  </header>

  <main id="main">
    <section class="auth-wrapper card">
      <h1>Створення акаунту</h1>
      <p class="muted">Зареєструйтесь, щоб купувати ігри та залишати відгуки.</p>

      <form id="registerForm" class="stack mt-16" novalidate>
        <div class="form-row">
          <label for="regUsername">Логін</label>
          <input id="regUsername" name="username" type="text" required minlength="3" maxlength="32" autocomplete="username">
          <span class="error-text" data-error-for="username"></span>
        </div>

        <div class="form-row">
          <label for="regEmail">Email</label>
          <input id="regEmail" name="email" type="email" required autocomplete="email">
          <span class="error-text" data-error-for="email"></span>
        </div>

        <div class="form-row">
          <label for="regPassword">Пароль</label>
          <input id="regPassword" name="password" type="password" required minlength="6" autocomplete="new-password">
          <span class="error-text" data-error-for="password"></span>
        </div>

        <div class="form-row">
          <label for="regPassword2">Повторіть пароль</label>
          <input id="regPassword2" name="password2" type="password" required autocomplete="new-password">
          <span class="error-text" data-error-for="password2"></span>
        </div>

        <div class="form-row">
          <label for="regRole">Тип акаунту</label>
          <select id="regRole" name="role">
            <option value="user" selected>Покупець</option>
            <option value="seller">Продавець (потрібна назва компанії)</option>
          </select>
        </div>

        <div class="form-row" id="companyRow" hidden>
          <label for="regCompany">Назва компанії</label>
          <input id="regCompany" name="company" type="text">
          <span class="error-text" data-error-for="company"></span>
        </div>

        <div class="form-row">
          <label for="regBirth">Дата народження</label>
          <input id="regBirth" name="birth" type="date">
        </div>

        <div class="form-row">
          <label>
            <input type="checkbox" name="agree" required>
            Я приймаю умови використання та політику приватності
          </label>
          <span class="error-text" data-error-for="agree"></span>
        </div>

        <button class="btn btn-primary btn-block" type="submit">Зареєструватись</button>
        <p class="success-text" id="registerSuccess" hidden></p>
      </form>

      <p class="muted mt-16 center">Вже маєте акаунт? <a href="/login.html">Увійти</a></p>
    </section>
  </main>

  <footer class="site">
    <div class="footer-inner">
      <div><h4>GameShop</h4><p>© 2026, КПІ ім. Сікорського</p></div>
    </div>
  </footer>

  <script src="/js/header.js" defer></script>
  <script src="/js/cart.js" defer></script>
  <script src="/js/validation.js" defer></script>
</body>
</html>
