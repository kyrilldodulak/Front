<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстрація — GameShop</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти до основного вмісту</a>

  <header id="siteHeader">
    <div class="header-inner">
      <a href="/" class="logo">GAME<span>SHOP</span></a>
      <nav aria-label="Основна навігація"></nav>
      <div class="header-actions" id="authBlock"></div>
    </div>
  </header>

  <main id="main">
    <section class="auth-box" aria-labelledby="registerTitle">
      <header class="auth-head">
        <h1 id="registerTitle">Реєстрація</h1>
        <p class="muted">Створи акаунт, щоб купувати ігри та залишати відгуки.</p>
      </header>

      <form id="registerForm" class="stack" novalidate>
        <div class="form-row">
          <label for="regUsername">Логін</label>
          <input id="regUsername" name="username" type="text" required minlength="3" maxlength="32" autocomplete="username">
          <span class="error-text" data-error-for="username"></span>
        </div>
        <div class="form-row">
          <label for="regEmail">Email</label>
          <input id="regEmail" name="email" type="email" required autocomplete="email">
          <span class="error-text" data-error-for="email"></span>
        </div>
        <div class="form-row">
          <label for="regPassword">Пароль</label>
          <div class="auth-password">
            <input id="regPassword" name="password" type="password" required minlength="6" autocomplete="new-password">
            <button type="button" class="auth-eye" data-toggle-password aria-label="Показати пароль">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="error-text" data-error-for="password"></span>
        </div>
        <div class="form-row">
          <label for="regPassword2">Повторіть пароль</label>
          <div class="auth-password">
            <input id="regPassword2" name="password2" type="password" required autocomplete="new-password">
            <button type="button" class="auth-eye" data-toggle-password aria-label="Показати пароль">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="error-text" data-error-for="password2"></span>
        </div>
        <div class="form-row">
          <label for="regBirth">Дата народження</label>
          <input id="regBirth" name="birth" type="date">
        </div>
        <div class="form-row">
          <label>
            <input type="checkbox" name="agree" required>
            Я приймаю умови використання та політику приватності
          </label>
          <span class="error-text" data-error-for="agree"></span>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Зареєструватись</button>
        <p class="success-text" id="registerSuccess" hidden></p>
      </form>

      <p class="auth-switch">Вже маєш акаунт? <a href="/login.html">Увійти</a></p>
    </section>
  </main>

  <footer class="site">
    <div class="footer-inner">
      <div><h4>GameShop</h4><p>© 2026, КПІ ім. Сікорського</p></div>
    </div>
  </footer>

  <script src="/js/header.js" defer></script>
  <script src="/js/cart.js" defer></script>
  <script src="/js/auth-ui.js" defer></script>
  <script src="/js/validation.js" defer></script>
</body>
</html>
